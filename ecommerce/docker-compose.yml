name: vitrine-commerce

x-db-env: &db-env
  DATABASE_URL: ${DATABASE_URL}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica o schema Prisma e popula dados de exemplo (roda uma vez e sai)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        APP: storefront
    command: sh -c "yarn workspace @repo/db db:push && yarn workspace @repo/db db:seed"
    environment:
      <<: *db-env
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  storefront:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: storefront
    restart: unless-stopped
    environment:
      <<: *db-env
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STOREFRONT_URL: ${STOREFRONT_URL}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: admin
    restart: unless-stopped
    environment:
      <<: *db-env
      AUTH_SECRET: ${AUTH_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      STOREFRONT_URL: ${STOREFRONT_URL}
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Opcional (dev): encaminha webhooks do Stripe para o storefront
  # docker compose --profile stripe up
  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: ["stripe"]
    command: listen --forward-to storefront:3000/api/webhooks/stripe --events checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
    depends_on:
      - storefront

volumes:
  pgdata:
