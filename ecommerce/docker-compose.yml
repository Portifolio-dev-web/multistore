name: vitrine-commerce

x-db-env: &db-env
  DATABASE_URL: ${DATABASE_URL}

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL}
  STOREFRONT_URL: ${STOREFRONT_URL}
  STOREFRONT_ROOT_DOMAIN: ${STOREFRONT_ROOT_DOMAIN:-}
  PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-0}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica as migrations e popula dados de exemplo (roda uma vez e sai)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        APP: storefront
    command: sh -c "yarn workspace @repo/db db:deploy && yarn workspace @repo/db db:seed && node scripts/storage-init.mjs"
    environment:
      <<: *db-env
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      S3_INIT_BUCKET: ${S3_INIT_BUCKET:-false}
      S3_REGION: ${S3_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    restart: "no"

  storefront:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: storefront
    restart: unless-stopped
    environment:
      <<: *app-env
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STOREFRONT_INTERNAL_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: admin
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: 3001
      ADMIN_URL: ${ADMIN_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      S3_REGION: ${S3_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Storage S3-compatível para desenvolvimento (RustFS — substituto mantido do MinIO).
  # Em produção, troque por AWS S3 / Cloudflare R2 apenas mudando as variáveis S3_*.
  storage:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    command: server --address 0.0.0.0:9000 /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "9000:9000"
    volumes:
      - storagedata:/data

  # Caixa de e-mail de desenvolvimento: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  # Opcional (dev): encaminha webhooks do Stripe para o storefront
  # docker compose --profile stripe up
  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: ["stripe"]
    command: listen --forward-to storefront:3000/api/webhooks/stripe --events checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
    depends_on:
      - storefront

volumes:
  pgdata:
  storagedata:
